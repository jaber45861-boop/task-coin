<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Task Coin</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <!-- Top Header / Action Area
         The old header action buttons were removed (MT-UI-03):
         withdraw/deposit actions now live inside the Wallet page, which
         opens from the circular wallet icon on Home. -->
    <header id="app-header" class="app-header"></header>

    <!-- Main Content Area -->
    <main id="app-content" class="app-content">
        <!-- Pages will be rendered here by JavaScript -->
    </main>

    <!-- Bottom Navigation -->
    <nav id="app-nav" class="app-nav">
        <button class="nav-item active" data-page="home">
            <span class="nav-icon">🏠</span>
            <span class="nav-label">الرئيسية</span>
        </button>
        <button class="nav-item" data-page="tasks">
            <span class="nav-icon">📋</span>
            <span class="nav-label">المهام</span>
        </button>
        <button class="nav-item" data-page="profile">
            <span class="nav-icon">👤</span>
            <span class="nav-label">حسابي</span>
        </button>
    </nav>

    <!-- Page Templates (hidden) -->
    <!-- Home is rendered dynamically by home.js -->

    <template id="page-tasks">
        <div class="page page-tasks">
            <div class="page-header">
                <h2>المهام</h2>
            </div>
            <div class="page-content">
                <p class="placeholder-text">قائمة المهام</p>
            </div>
        </div>
    </template>

    <template id="page-profile">
        <div class="page page-profile">
            <div class="page-header">
                <h2>حسابي</h2>
            </div>
            <div class="page-content">
                <p class="placeholder-text">معلومات الحساب</p>
            </div>
        </div>
    </template>

    <script src="js/telegram.js"></script>
    <script src="js/header.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/wallet-data.js"></script>
    <script src="js/social.js"></script>
    <script src="js/wallet.js"></script>
    <script src="js/home.js"></script>
    <script src="js/tasks.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
